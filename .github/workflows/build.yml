name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.13'

    - name: Check formatting
      run: |
        set -euo pipefail
        needs_formatting=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
        if [ -n "$needs_formatting" ]; then
          echo "The following files need gofmt:"
          echo "$needs_formatting"
          exit 1
        fi

    - name: Go vet
      run: go vet ./...

    - name: Build
      run: go build -v -o bin/ai-sessions ./cmd/ai-sessions

    - name: Test
      run: go test -cover ./...

    - name: Test (CGO_ENABLED=0)
      run: |
        # Verify the pure-Go sqlite driver works without CGO,
        # matching how release binaries are cross-compiled.
        CGO_ENABLED=0 go test ./...
